name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build per-ABI and universal debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Normalize wrapper line endings and set permissions
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build per-ABI and universal debug APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify all ABI APK outputs
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "app/build/outputs/apk/debug/app-${abi}-debug.apk"
          done
          test -f app/build/outputs/apk/debug/app-universal-debug.apk
          ls -l app/build/outputs/apk/debug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dragon-sound-debug-per-abi-and-universal
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

name: Android Debug and Signed Release APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build per-ABI debug and signed release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Firebase Android configuration
        env:
          FIREBASE_ANDROID_CONFIG_B64: ${{ secrets.FIREBASE_ANDROID_CONFIG_B64 }}
        run: |
          set -euo pipefail
          : "${FIREBASE_ANDROID_CONFIG_B64:?Missing FIREBASE_ANDROID_CONFIG_B64 secret}"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_B64" | base64 --decode > app/google-services.json
          jq -e '.project_info.project_id == "dragon-sound" and any(.client[]; .client_info.android_client_info.package_name == "com.audifono.propietario")' app/google-services.json > /dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Normalize wrapper line endings and set permissions
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build per-ABI debug APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify all debug APK outputs
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "app/build/outputs/apk/debug/app-${abi}-debug.apk"
          done
          test -f app/build/outputs/apk/debug/app-universal-debug.apk
          ls -l app/build/outputs/apk/debug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: dragon-sound-debug-per-abi-and-universal
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Decode release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dragon-sound-release.p12"
          test -s "$RUNNER_TEMP/dragon-sound-release.p12"
          chmod 600 "$RUNNER_TEMP/dragon-sound-release.p12"

      - name: Build, sign, and verify per-ABI release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dragon-sound-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_SIGNER_SHA256: e455102f1de49a92f12c69d55cf883502f32f5dec0cc8207d56c39616487a348
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          ./gradlew assembleRelease --no-daemon --stacktrace
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$apksigner"
          signed_dir=app/build/outputs/apk/release/signed
          mkdir -p "$signed_dir"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "app-${abi}-release*.apk" -print -quit)
            test -n "$apk"
            signed_apk="$signed_dir/app-${abi}-release.apk"
            "$apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$signed_apk" "$apk"
            verification_output=$("$apksigner" verify --verbose --print-certs "$signed_apk")
            printf '%s\n' "$verification_output" | grep -Fqi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256"
          done
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-universal-release*.apk' -print -quit)
          test -n "$apk"
          signed_apk="$signed_dir/app-universal-release.apk"
          "$apksigner" sign --ks "$ANDROID_KEYSTORE_PATH" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$signed_apk" "$apk"
          verification_output=$("$apksigner" verify --verbose --print-certs "$signed_apk")
          printf '%s\n' "$verification_output" | grep -Fqi "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -f "$signed_dir/app-${abi}-release.apk"
          done
          test -f "$signed_dir/app-universal-release.apk"
          ls -l "$signed_dir"

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dragon-sound-release.p12"

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: dragon-sound-signed-release-per-abi-and-universal
          path: app/build/outputs/apk/release/signed/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary Firebase configuration
        if: always()
        run: rm -f app/google-services.json
